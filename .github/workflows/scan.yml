name: scan

on:
  push:
  pull_request:

jobs:
  secrets:
    name: private-data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Whole tree, not just the diff: a file added in an earlier commit and
      # only now merged must still be caught.
      - run: python3 scripts/scan_secrets.py
